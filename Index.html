<html>
<head>
    <title>login form</title>
</head>
<style>

*{
    font-family: 'Poppins',sans-serif;

}
 body{
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    min-height: 100vh;
    background-image: url("https://images.pexels.com/photos/11396175/pexels-photo-11396175.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    cursor: url('cursor.png') 0 0 auto;
 }
 .forms{
    background:transparent;
    height: 23em;
    width: 400px;
    border: 0;
    padding-top: 0px;
    padding-bottom: 10PX;
    margin:0;
    border: 1px solid rgb(141, 137, 137);
    backdrop-filter: blur(2px);
    border-radius: 20px;
    padding: 10px;

 } 
 .forms:hover{
   box-shadow: 0 0 20px 5px rgb(163, 202, 211);
   background: transparent; 
 }
 .forms h2{
  font-size: 40px;
    text-align: center;
 }
 h2,.box,.name{
    color: white;
 }


 .forms .name{
    width: 100%;
    height: 20%;
    margin: 0px;
    margin-left: 0px;
    padding: 0;
    color: white;
    background:transparent;

 }
 .name input{
    margin: 10px;
    width: 100%;
    height: 50px;
    margin-top:0;
    margin-left: 0;
    margin-bottom: 10px;
    border:1 solid white;
    padding: 20px;
    border-radius: 30px;
    font-size: 16px;
    color: white;
     border: 1px solid rgb(185, 173, 173);
    background: transparent;
    outline: none;
 }

 input::placeholder{
    color: rgb(232, 225, 225);

 }



.sub{
    margin:0;
   font-style: normal;
    font-size: 17px;
    height: 54px;
    width: 40%;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 20px;
    border-radius: 30px;
    text-align: center;
    padding:0px 0;
    cursor: pointer;
    margin-left: 110px;
}


.sub:hover{
    box-shadow: 0 0 0 2px rgb(255, 255, 255);
    transform: translatez(10px 10px);
}

.box{
     color: white;
    font-size: 17px;
    border: 0px;
    margin:0px;
    margin-left: 10px;
    accent-color: rgb(122, 139, 221);
    margin-right: 10px;
    text-decoration:none;
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}
.box a{
     color: white;
}
</style>
<body>
    <form>
        <div class="forms">
        <h2>Login</h2>
            <div class="name">

                <input type="text" placeholder="Username">
            </div>
           <div class="name">

                <input type="password" placeholder="Password">
          </div>
          <div class="box">
    <label><input type="checkbox" margin=0><span class="mark"></span>Remember me</label>
    <a href="#">Forgot Password?</a>
          </div>
    <button class="sub" type="submit"><h3>login</h3></button>

    </div>
    </form>
</body>
</html>
